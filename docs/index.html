<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rodostrom – PDF z GEDCOM</title>
<meta name="description" content="Vytvorte PDF schému predkov z GEDCOM súboru priamo v prehliadači. Súbor sa nikam neodosiela.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M6 16h6M12 8v16M12 8h6M12 24h6M18 4v8M18 20v8M18 4h6M18 12h6M18 20h6M18 28h6' stroke='%232f6b4f' stroke-width='2.5' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --text: #1d1f1c; --muted: #62675f;
    --border: #dcdad2; --accent: #2f6b4f; --accent-text: #ffffff; --accent-soft: #e3efe8;
    --danger: #a3341f; --focus: #2f6b4f55;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #151714; --panel: #1f221e; --text: #e8eae4; --muted: #a0a69b;
      --border: #363a33; --accent: #6fbf95; --accent-text: #0f1a14; --accent-soft: #24352b;
      --danger: #f08a73; --focus: #6fbf9566;
    }
  }
  :root[data-theme="dark"] {
    --bg: #151714; --panel: #1f221e; --text: #e8eae4; --muted: #a0a69b;
    --border: #363a33; --accent: #6fbf95; --accent-text: #0f1a14; --accent-soft: #24352b;
    --danger: #f08a73; --focus: #6fbf9566;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 26px; margin: 0 0 4px; letter-spacing: -0.01em; }
  .lead { color: var(--muted); margin: 0 0 20px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
           padding: 18px; margin-bottom: 16px; }
  .panel h2 { font-size: 16px; margin: 0 0 12px; display: flex; gap: 8px; align-items: center; }
  .step { display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%;
          background: var(--accent-soft); color: var(--accent); font-size: 13px; font-weight: 700; }
  .drop { display: block; border: 2px dashed var(--border); border-radius: 10px; padding: 22px; text-align: center;
          cursor: pointer; transition: border-color .15s, background .15s; }
  .drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); }
  .drop strong { color: var(--accent); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .note { color: var(--muted); font-size: 13px; margin: 10px 0 0; }
  button, .btn { font: inherit; border-radius: 8px; border: 1px solid var(--border);
                 background: var(--panel); color: var(--text); padding: 8px 14px; cursor: pointer;
                 text-decoration: none; display: inline-block; }
  button:hover, .btn:hover { border-color: var(--accent); }
  button.primary, .btn.primary { background: var(--accent); color: var(--accent-text);
                                 border-color: var(--accent); font-weight: 600; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.link { border: 0; background: none; color: var(--accent); padding: 0; text-decoration: underline; }
  input[type=text], input[type=search], input[type=number], select {
    font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; padding: 7px 10px; width: 100%; }
  input:focus, select:focus, button:focus-visible { outline: 3px solid var(--focus); outline-offset: 1px; }
  .people { margin-top: 10px; border: 1px solid var(--border); border-radius: 8px;
            max-height: 300px; overflow: auto; }
  .people table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .people th { position: sticky; top: 0; background: var(--panel); text-align: left;
               font-weight: 600; color: var(--muted); font-size: 12px; text-transform: uppercase;
               letter-spacing: .04em; padding: 6px 10px; border-bottom: 1px solid var(--border); }
  .people td { padding: 6px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .people td.name { white-space: normal; }
  .people tr { cursor: pointer; }
  .people tbody tr:hover { background: var(--accent-soft); }
  .people tr.sel { background: var(--accent); color: var(--accent-text); }
  .people .num { font-variant-numeric: tabular-nums; color: inherit; opacity: .8; }
  .chosen { margin-top: 10px; font-size: 14px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px 16px; }
  .grid label { display: block; font-size: 13px; color: var(--muted); }
  .grid label > select, .grid label > input { margin-top: 3px; color: var(--text); }
  .checks { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 14px; font-size: 14px; }
  .checks label { display: flex; gap: 6px; align-items: center; cursor: pointer; }
  .wide { grid-column: 1 / -1; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .seg label { cursor: pointer; }
  .seg input { position: absolute; opacity: 0; pointer-events: none; }
  .seg > label > span { display: block; height: 100%; border: 1px solid var(--border); border-radius: 10px;
              padding: 10px 12px; transition: border-color .15s, background .15s; }
  .seg b { display: block; font-size: 15px; }
  .seg small { display: block; color: var(--muted); font-size: 12.5px; line-height: 1.35; margin-top: 2px; }
  .seg input:checked + span { border-color: var(--accent); background: var(--accent-soft);
                              box-shadow: inset 0 0 0 1px var(--accent); }
  .seg input:focus-visible + span { outline: 3px solid var(--focus); outline-offset: 1px; }
  .status { font-size: 14px; color: var(--muted); }
  .status.err { color: var(--danger); }
  .preview { margin-top: 14px; width: 100%; height: 75vh; border: 1px solid var(--border);
             border-radius: 8px; background: #fff; display: none; }
  footer { color: var(--muted); font-size: 13px; text-align: center; margin-top: 28px; }
  footer a { color: var(--accent); }
  @media (max-width: 560px) { .people .hide-sm { display: none; } h1 { font-size: 22px; } }
  header.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .flag { width: 24px; height: 16px; border-radius: 2px; flex: none;
          box-shadow: 0 0 0 1px rgba(0,0,0,.18); display: block; }
  .lang { position: relative; flex: none; }
  .lang > button { display: flex; align-items: center; gap: 8px; padding: 6px 10px; }
  .lang > button .caret { font-size: 11px; color: var(--muted); }
  .lang ul { position: absolute; right: 0; top: calc(100% + 6px); z-index: 10; list-style: none;
             margin: 0; padding: 6px; background: var(--panel); border: 1px solid var(--border);
             border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.15); min-width: 190px;
             max-height: 70vh; overflow: auto; }
  .lang li button { display: flex; align-items: center; gap: 10px; width: 100%; border: 0;
                    background: none; padding: 7px 10px; border-radius: 6px; text-align: left; }
  .lang li button:hover, .lang li button:focus-visible { background: var(--accent-soft); }
  .lang li button[aria-selected="true"] { font-weight: 600; color: var(--accent); }
  @media (max-width: 560px) { .lang > button .lname { display: none; } }
</style>
</head>
<body>
<main>
  <header class="top">
    <div>
      <h1>Rodostrom</h1>
      <p class="lead" data-i18n="lead"></p>
    </div>
    <div class="lang">
      <button type="button" id="langBtn" aria-haspopup="listbox" aria-expanded="false">
        <span id="langFlag"></span><span class="lname" id="langName"></span><span class="caret">▾</span>
      </button>
      <ul id="langMenu" role="listbox" hidden></ul>
    </div>
  </header>

  <section class="panel">
    <h2><span class="step">1</span><span data-i18n="step1"></span></h2>
    <label class="drop" id="drop">
      <input type="file" id="file" accept=".ged,.GED,.gedcom,text/plain" hidden>
      <div id="dropText"></div>
    </label>
    <p class="note"><span data-i18n="privacy"></span>
      <button class="link" id="sample" type="button" data-i18n="sample"></button></p>
  </section>

  <section class="panel" id="personPanel" hidden>
    <h2><span class="step">2</span><span data-i18n="step2"></span></h2>
    <div class="seg" role="radiogroup">
      <label><input type="radio" name="chart" data-opt="chart" value="ancestors">
        <span><b data-i18n="anc"></b><small><span data-i18n="ancDesc1"></span><br><span data-i18n="ancDesc2"></span></small></span></label>
      <label><input type="radio" name="chart" data-opt="chart" value="descendants">
        <span><b data-i18n="desc"></b><small><span data-i18n="descDesc1"></span><br><span data-i18n="descDesc2"></span></small></span></label>
    </div>
    <input type="search" id="search" data-i18n-ph="search" autocomplete="off">
    <div class="people">
      <table>
        <thead><tr><th class="hide-sm">ID</th><th data-i18n="thName"></th><th data-i18n="thBirth"></th><th class="hide-sm" data-i18n="thDeath"></th></tr></thead>
        <tbody id="list"></tbody>
      </table>
    </div>
    <div class="chosen" id="chosen"></div>
  </section>

  <section class="panel" id="optPanel" hidden>
    <h2><span class="step">3</span><span data-i18n="step3"></span></h2>
    <div class="grid">
      <label><span data-i18n="labels"></span>
        <select data-opt="labels"><option value="symbols"></option><option value="abbr"></option></select></label>
      <label><span data-i18n="dates"></span>
        <select data-opt="dates"><option value="year" data-i18n="year"></option><option value="full" data-i18n="fullDate"></option></select></label>
      <label><span data-i18n="places"></span>
        <select data-opt="places"><option value="none" data-i18n="noPlaces"></option><option value="short" data-i18n="shortPlace"></option><option value="full" data-i18n="fullPlace"></option></select></label>
      <label><span data-i18n="numbering"></span>
        <select data-opt="numbering"><option value="generation"></option><option value="ahnentafel"></option><option value="daboville"></option><option value="none"></option></select></label>
      <label class="only-anc"><span data-i18n="marriageOn"></span>
        <select data-opt="marriageOn"><option value="father" data-i18n="marrFather"></option><option value="both" data-i18n="marrBoth"></option><option value="none" data-i18n="marrNone"></option></select></label>
      <label><span data-i18n="pageSize"></span>
        <select data-opt="pageSize"><option value="a4">A4</option><option value="a3">A3</option><option value="a5">A5</option><option value="letter">Letter</option><option value="legal">Legal</option></select></label>
      <label><span data-i18n="orientation"></span>
        <select data-opt="orientation"><option value="portrait" data-i18n="portrait"></option><option value="landscape" data-i18n="landscape"></option></select></label>
      <label><span data-i18n="generations"></span>
        <input type="number" data-opt="generations" min="0" max="99" step="1"></label>
      <label><span data-i18n="fontSize"></span>
        <input type="number" data-opt="fontSize" min="5" max="20" step="0.5"></label>
      <label class="wide"><span data-i18n="title"></span>
        <input type="text" data-opt="title" data-i18n-ph="titlePh"></label>
    </div>
    <div class="checks">
      <label class="only-desc"><input type="checkbox" data-opt="showSpouses"> <span data-i18n="showSpouses"></span></label>
      <label><input type="checkbox" data-opt="repeat"> <span data-i18n="repeat"></span></label>
      <label class="only-anc"><input type="checkbox" data-opt="motherFirst"> <span data-i18n="motherFirst"></span></label>
      <label><input type="checkbox" data-opt="showIds"> <span data-i18n="showIds"></span></label>
      <label><input type="checkbox" data-opt="showDate"> <span data-i18n="showDate"></span></label>
    </div>
  </section>

  <section class="panel" id="goPanel" hidden>
    <div class="row">
      <button class="primary" id="go" type="button" data-i18n="go"></button>
      <a class="btn" id="download" hidden data-i18n="download"></a>
      <span class="status" id="status"></span>
    </div>
    <iframe class="preview" id="preview"></iframe>
  </section>

  <footer>Open source · <a href="https://github.com/r3mus99/gedcom-to-pdf">GitHub</a> · <span data-i18n="license"></span></footer>
</main>

<script src="vendor/pdf-lib.min.js"></script>
<script src="vendor/fontkit.umd.min.js"></script>
<script src="rodostrom.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
